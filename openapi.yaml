openapi: 3.0.3
info:
  title: CaitrionaDemo
  version: 1.0.0
  description: RESTful API for searching train routes, pricing fares, and booking/managing train tickets.
servers:
  - url: https://api.caitrionademo.example.com/v1
tags:
  - name: Stations
  - name: Routes
  - name: Tickets
  - name: Health

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                    example: 2026-09-22T15:00:00Z

  /stations:
    get:
      tags: [Stations]
      summary: List train stations
      operationId: listStations
      parameters:
        - in: query
          name: country
          schema:
            type: string
            example: IE
          description: Filter stations by country code
      responses:
        '200':
          description: Stations returned
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Station'

  /routes/search:
    get:
      tags: [Routes]
      summary: Search available routes
      operationId: searchRoutes
      parameters:
        - in: query
          name: fromStationCode
          required: true
          schema:
            type: string
            example: DUB
        - in: query
          name: toStationCode
          required: true
          schema:
            type: string
            example: CRK
        - in: query
          name: departureDate
          required: true
          schema:
            type: string
            format: date
            example: 2026-10-01
        - in: query
          name: passengers
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Matching routes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Route'

  /tickets/quote:
    post:
      tags: [Tickets]
      summary: Get fare quote before booking
      operationId: quoteTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketQuoteRequest'
      responses:
        '200':
          description: Fare quote calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketQuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /tickets:
    post:
      tags: [Tickets]
      summary: Create a train ticket booking
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Tickets]
      summary: List tickets
      operationId: listTickets
      parameters:
        - in: query
          name: email
          schema:
            type: string
            format: email
            example: traveler@example.com
      responses:
        '200':
          description: Tickets returned
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'

  /tickets/{ticketId}:
    get:
      tags: [Tickets]
      summary: Get ticket by ID
      operationId: getTicketById
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ticket returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tickets]
      summary: Update seat or passenger details
      operationId: updateTicket
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Ticket updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{ticketId}/cancel:
    post:
      tags: [Tickets]
      summary: Cancel ticket
      operationId: cancelTicket
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ticket canceled
          content:
            application/json:
              schema:
                type: object
                required: [ticketId, status, canceledAt]
                properties:
                  ticketId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: canceled
                  canceledAt:
                    type: string
                    format: date-time
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Station:
      type: object
      required: [code, name, city, country]
      properties:
        code:
          type: string
          example: DUB
        name:
          type: string
          example: Heuston Station
        city:
          type: string
          example: Dublin
        country:
          type: string
          example: IE

    Route:
      type: object
      required: [routeId, fromStationCode, toStationCode, departureTime, arrivalTime, durationMinutes]
      properties:
        routeId:
          type: string
          example: RTE-1001
        fromStationCode:
          type: string
          example: DUB
        toStationCode:
          type: string
          example: CRK
        departureTime:
          type: string
          format: date-time
        arrivalTime:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          example: 165

    TicketQuoteRequest:
      type: object
      required: [routeId, travelDate, passengers, seatClass]
      properties:
        routeId:
          type: string
          example: RTE-1001
        travelDate:
          type: string
          format: date
          example: 2026-10-01
        passengers:
          type: integer
          minimum: 1
          example: 2
        seatClass:
          type: string
          enum: [standard, first]
          example: standard

    TicketQuoteResponse:
      type: object
      required: [currency, baseFare, taxes, totalFare]
      properties:
        currency:
          type: string
          example: EUR
        baseFare:
          type: number
          format: float
          example: 49.99
        taxes:
          type: number
          format: float
          example: 5.50
        totalFare:
          type: number
          format: float
          example: 55.49

    Passenger:
      type: object
      required: [fullName, email]
      properties:
        fullName:
          type: string
          example: Caitriona Murphy
        email:
          type: string
          format: email
          example: caitriona@example.com

    CreateTicketRequest:
      type: object
      required: [routeId, travelDate, seatClass, passenger]
      properties:
        routeId:
          type: string
        travelDate:
          type: string
          format: date
        seatClass:
          type: string
          enum: [standard, first]
        passenger:
          $ref: '#/components/schemas/Passenger'
        seatPreference:
          type: string
          enum: [window, aisle, no_preference]
          default: no_preference

    UpdateTicketRequest:
      type: object
      properties:
        seatPreference:
          type: string
          enum: [window, aisle, no_preference]
        passenger:
          $ref: '#/components/schemas/Passenger'

    Ticket:
      type: object
      required: [ticketId, routeId, travelDate, seatClass, status, passenger, createdAt]
      properties:
        ticketId:
          type: string
          format: uuid
        routeId:
          type: string
        travelDate:
          type: string
          format: date
        seatClass:
          type: string
          enum: [standard, first]
        seatNumber:
          type: string
          example: C12
        status:
          type: string
          enum: [booked, canceled]
        passenger:
          $ref: '#/components/schemas/Passenger'
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid departureDate format
        details:
          type: array
          items:
            type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
